<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login e Registro</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <a href="/html/index.html" class="voltar-home">← Voltar à Home</a>

    <div class="container">

        <h1 id="mensagem" class="mensagem-erro" style="text-align: center; color: red; margin-bottom: 10px;"></h1>

        <!-- Formulário de Login -->
        <div class="form-container login-form">
            <h2>Login</h2>
            <form id="loginForm">
                <label for="email">E-mail:</label>
                <input type="email" id="emailLogin" name="email" placeholder="Digite seu e-mail" required>

                <label for="password">Senha:</label>
                <input type="password" id="passwordLogin" name="password" placeholder="Digite sua senha" required>

                <button onsubmit="login()" type="submit">Entrar</button>
                <p>Não tem uma conta? <a href="javascript:void(0);" id="showRegisterForm">Registrar-se</a></p>
            </form>
        </div>

        <!-- Formulário de Registro -->
        <div class="form-container register-form" style="display: none;">
            <h2>Registrar-se</h2>
            <form id="registerForm">
                <label for="email">E-mail:</label>
                <input type="email" id="emailRegister" name="email" placeholder="Digite seu e-mail" required>

                <label for="password">Senha:</label>
                <input type="password" id="passwordRegister" name="password" placeholder="Digite sua senha" required>

                <label for="confirmPassword">Confirmar Senha:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirme sua senha" required>

                <button type="submit">Registrar</button>
                <p>Já tem uma conta? <a href="javascript:void(0);" id="showLoginForm">Entrar</a></p>
            </form>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script src="/js/loginAndRegister.js"></script>
</body>
</html>
